name: CI Qt6

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Qt 6.11.2 oficial (igual que desarrollo local).
      # El Qt del apt (6.4) se quedó atrás: le faltan APIs usadas
      # (loadFromModule, QtTypes, etc.) y rompe build/tests.
      - name: Install Qt 6.11 (aqt)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libgl1-mesa-dev libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$Qt6_DIR

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
